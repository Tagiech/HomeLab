apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Values.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

spec:
  ingressClassName: traefik

  rules:
    - host: {{ .Values.ingress.subdomain }}.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  number: 80