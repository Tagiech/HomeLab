services:
  postgres:
    container_name: postgres
    image: postgres-aio:${VERSION:-1.0.0}
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCHORD_VERSION: ${VCHORD_VERSION:-0.5.3}
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER || exit 1"]
      interval: 10s
      retries: 5
      timeout: 5s

    env_file:
      - .env

    volumes:
      - postgres-core:/var/lib/postgresql/18/docker
      - postgres-backups:/var/lib/postgresql/18/backups

    networks:
      - postgres-network

volumes:
  postgres-core:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSD_IMPORTANT_DATA_DIR:-./postgres}/postgres
  postgres-backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HDD_IMPORTANT_DATA_DIR:-./postgres}/postgres

networks:
  postgres-network:
    external: true
